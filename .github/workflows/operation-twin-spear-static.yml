name: Operation Twin Spear static checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  stage1-static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate mission contract
        run: python3 operation_twin_spear.v0001/tools/static_check.py
